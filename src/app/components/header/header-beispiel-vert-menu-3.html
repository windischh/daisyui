<!-- Navbar -->
<div class="navbar fixed top-0 w-full z-50 bg-base-100 shadow-md">
  <div class="flex-1">
    <a class="btn btn-ghost text-xl">Meine Website</a>
  </div>
  <div class="flex-none">
    <button class="btn btn-square btn-ghost" 
        (click)="verticalMenu.classList.toggle('hidden');
        verticalMenu.classList.toggle('opacity-0');
        verticalMenu.classList.toggle('-translate-y-4');">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>
</div>

<!-- Vertikales Menü mit Animatio - animation does not work !!!n -->

  <ul class="menu menu-vertical p-4">
    <li><a>Menüpunkt 1</a></li>
    <li><a>Menüpunkt 2</a></li>
    <li><a>Menüpunkt 3</a></li>
  </ul>
</div>

  <p class="mb-4">Hier beginnt der Inhalt deiner Seite.</p>
  <p>
    Das vertikale Menü überdeckt diesen Bereich mit einer Animation, wenn es geöffnet ist.
  </p>
  <p class="mt-32">...</p>
</div>

<!-- script is ignored when using angular -->
<script>
  const menuToggle = document.getElementById('menu-toggle');
  const verticalMenu = document.getElementById('vertical-menu');

  menuToggle.addEventListener('click', () => {
    verticalMenu.classList.toggle('hidden');
