<br>
<div class="container mx-auto p-4">
  <div class="flex justify-center">
    <h2 class="text-2xl font-bold text-center">  {{auth.txt['status']}} </h2>
  </div>
  <div class="flex flex-wrap gap-4 items-center justify-center">
    <div class="flex items-center gap-2">
      <h3>  {{auth.txt['mode']}}: </h3>
      <select class="select select-primary" (change)="selectMode($event)">
        @for (mode of modeChoices; track mode) {
          <option [value]="mode.value"
            [selected]="mode.isSelected">
            {{mode.text}}
          </option>
        }
      </select>
    </div>
    <div class="flex items-center gap-2">
      <h3> {{auth.txt['last_tx_time']}}: </h3>
      <h3> {{session?.lastTxClient|date:'dd.MM.yyyy HH:mm'}} </h3>
    </div>
    <div class="flex items-center gap-2">
      <h3>  {{auth.txt['language']}}: </h3>
      <select class="select select-primary" (change)="selectLanguage($event)">
        @for (lang of languageChoices; track lang) {
          <option [value]="lang.value"
            [selected]="lang.isSelected">
            {{lang.text}}
          </option>
        }
      </select>
    </div>
  </div>
</div>
