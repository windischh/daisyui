<!-- FORM starts here                    -->
<form [formGroup] = "thisForm"
  (ngSubmit)="submitForm()">

  <!-- SHOW  - outer frame                                     -->
  <div class="container mx-auto p-4">
    <div class="flex justify-center">
      <!-- TODO make number of columns responsive: three columns at desktop, 2 columns at tablet, 1 column at smartphone  -->
      <!-- UPDATE login user, pw                       -->
      <div class="w-full md:w-1/2 flex flex-col gap-4">
        <fieldset formGroupName="uniqueId" class="card bg-base-100 shadow-md">
          <div class="card-body flex flex-col gap-3">
            <legend class="badge badge-success text-primary-content">{{loginProvider.providerName}} - {{auth.txt['enter_your_login']}}:</legend>
            <div class="flex items-center gap-4">
              <div class="w-1/3">
                <label for="login" class="label">{{auth.txt['login']}}:</label>
              </div>
              <div class="flex-1">
                <input type="text" placeholder="login" id="login" formControlName="login" class="input input-bordered w-full">
              </div>
            </div>
            @if (errors['uniqueId_login']) {
              <div class="alert alert-error">
                {{ errors['uniqueId_login'] }}
              </div>
            }
            <div class="flex items-center gap-4">
              <div class="w-1/3">
                <label for="pw" class="label">{{auth.txt['password']}}:</label>
              </div>
              <div class="flex-1">
                <input type="password" placeholder="password" id="pw" formControlName="password" class="input input-bordered w-full">
              </div>
            </div>
            @if (errors['uniqueId_password']) {
              <div class="alert alert-error">
                {{ errors['uniqueId_password'] }}
              </div>
            }
            @if (errors['uniqueId']) {
              <div class="alert alert-error">
                {{ errors['uniqueId'] }}
              </div>
            }
            @if (!isRememberAnyway) {
              <div class="form-control">
                <label class="label cursor-pointer gap-2">
                  <input type="checkbox" formControlName="isRemember" class="checkbox checkbox-sm">
                  <span class="label-text">{{auth.txt['remember_login']}}</span>
                </label>
              </div>
            }
          </div>
        </fieldset>
        <!-- BUTTONs submit "actual" form            -->
        <div class="flex gap-2">
          <button class="btn btn-sm btn-success text-primary-content"
            type="submit" data-testid="login-submit"
            [disabled]="!thisForm.valid">{{auth.txt['enter']}}
            <i class="fas fa-check"></i>
          </button>
          <button class="btn btn-sm btn-error text-primary-content"
            type="submit"
            (click)="thisForm.value.uniqueId.password = ''">{{auth.txt['cancel']}}
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <!-- SHOW  - END of outer frame                                     -->
    </div>
  </div>
</form>
