<div class="container mx-auto p-4">
  <div class="flex items-start">
    <div class="flex-1"></div>
    <div class="flex-none text-center">
      <h1 class="text-2xl md:text-3xl font-bold">
         {{usertxt['className']}}
      </h1>
    </div>
    <div class="flex-1 flex justify-end gap-3">
      <div class='fle1-1'>
        <div class="form-control mt-2">
          <label class="label cursor-pointer">
            <input type="checkbox" [checked]="false" (change)="setAdminMode()" class="checkbox checkbox-sm">
            <span class="label-text text-sm ml-2">{{auth.txt['admin_mode'] }}</span>
          </label>
        </div>
      </div>
      <div class='fle1-1'>
        <button class="btn btn-circle btn-sm btn-error text-primary-content tooltip tooltip-bottom tooltip-primary"
          [attr.data-tip]="auth.txt['close']"
          (click)="return()">
          <i class="fas fa-times"></i>
        </button>
      </div> <!-- end flex-1 for button-->
    </div> <!-- end of 3rd flex of header line-->
  </div> <!-- end  of header line-->
</div> <!-- end  of container -->
@if (refreshSignal() === 1 && auth && users && isShowList) {
  <dsy-user-list-view
    [users]="users" [userId]="userId"
    [isCreate]="isCreate" [isMaint]="isMaint" [txt]="auth.txt" [usertxt]="usertxt"
    (userListClose)="closeUserList()" (userInsert)="insertUser()" (userSelect)="selectUser($event)"
    (userShow)="showUser($event)" (userMaint)="maintUser($event)" (userDisable)="disableUser($event)"
    (updateUser)="userUpdate($event)">
  </dsy-user-list-view>
}
@if (auth && (user || formAction === 'new') && (userComponentUsage  === 'form' || isShowForm)) {
  <dsy-user-form-view
    [formAction]="formAction" [user]="user" [txt]="auth.txt" [usertxt]="usertxt"
    (userFormClose)="closeUserForm()" (updateUser)="userUpdate($event)" (newUser)="userCreate($event)">
  </dsy-user-form-view>
}
