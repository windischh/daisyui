<!-- ATTENTION  [ngClass] is used to set css behaviour - in this case via daisyUI -->
<div class="join w-full" [ngClass]="{ loading: isLoading }">
  <input (keyup)="findEvents(searchTerm.value)" #searchTerm type="text" placeholder="{{auth.txt['search']}}... " class="input input-sm join-item w-full">
  <button class="btn btn-sm join-item" type="button" (click)="findEvents(searchTerm.value)">
    <i class="fas fa-search"></i>
  </button>
</div>
<div class="dropdown-content absolute z-1 shadow bg-base-100 rounded-box p-2 w-full mt-2" [ngClass]="{ hidden: !foundEvents.length }">
  @for (event of foundEvents; track event) {
    <a href (click)="selectEvent(event); false">
      <div class="font-bold">{{ event.eventBegin|date:'EEE dd.MM.yyyy' }}</div>
      <div id="searchContent" [innerHTML]="event.summary.replace(this.text, '<mark>' + this.text + '</mark>')"></div>
      <div [innerHTML]="event.description.substring(0,50).replace(this.text, '<mark>' + this.text + '</mark>')"></div>
    </a>
  }
</div>
